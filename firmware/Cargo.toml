[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32c071fb", "time-driver-any", "memory-x", "time", "defmt"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"], default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
